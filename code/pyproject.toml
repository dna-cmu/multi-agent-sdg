[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdg-credibility-framework"
version = "0.1.0"
description = "An agentic AI framework for assessing the credibility of corporate SDG alignment claims in sustainability reports (SMTEC)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Damrongsak Naparat", email = "damrongsak.naparat@cmu.ac.th" },
]
keywords = [
    "sustainability",
    "sdg",
    "credibility",
    "content-analysis",
    "llm",
    "agentic-ai",
    "smtec",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "landingai-ade>=0.2.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["agents", "config", "prompts", "utils"]

[tool.ruff]
line-length = 100
target-version = "py310"
